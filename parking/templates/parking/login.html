{% extends "parking/base.html" %}
{% block title %}Login | Smart Parking Analysis{% endblock %}

{% block content %}
<div class="auth-container">
  <article class="auth-card glass-card">
    <h2><i class="fa-solid fa-key"></i> Login</h2>
    <p class="auth-subtext">Welcome back! Please enter your details.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label for="{{ form.username.id_for_label }}">Username</label>
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          {{ form.username }}
        </div>
      </div>
      <div class="form-group">
        <label for="{{ form.password.id_for_label }}">Password</label>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          {{ form.password }}
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="auth-link">No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </article>
</div>
{% endblock %}
