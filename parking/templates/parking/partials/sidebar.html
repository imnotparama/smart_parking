<nav id="sidebar" class="sidebar" aria-label="Primary Navigation">
  <div class="sidebar-title">
    <a href="{% url 'home' %}" class="logo-link">
      <i class="fa-solid fa-car-on"></i>
      <span class="app-name">Smart Parking</span>
    </a>
  </div>

  <ul>
    <li class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
      <a href="{% url 'home' %}"><i class="fa-solid fa-house"></i> Home</a>
    </li>

    {% if user.is_authenticated %}
      <li class="{% if request.resolver_match.url_name == 'my_bookings' %}active{% endif %}">
        <a href="{% url 'my_bookings' %}"><i class="fa-solid fa-clipboard-list"></i> My Bookings</a>
      </li>
      <li class="{% if request.resolver_match.url_name == 'user_analytics' %}active{% endif %}">
        <a href="{% url 'user_analytics' %}"><i class="fa-solid fa-chart-pie"></i> My Analytics</a>
      </li>

      {% if user.is_staff %}
        <li class="{% if request.resolver_match.url_name == 'admin_analytics' %}active{% endif %}">
          <a href="{% url 'admin_analytics' %}"><i class="fa-solid fa-user-shield"></i> Admin Dashboard</a>
        </li>
      {% endif %}

      <li>
        <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </li>
    {% else %}
      <li>
        <a href="{% url 'login' %}"><i class="fa-solid fa-key"></i> Login</a>
      </li>
      <li>
        <a href="{% url 'signup' %}"><i class="fa-solid fa-pen"></i> Sign Up</a>
      </li>
    {% endif %}

    <li>
      <a href="{% url 'help' %}"><i class="fa-solid fa-circle-question"></i> Help</a>
    </li>
  </ul>

  {% if user.is_authenticated %}
    <div class="sidebar-user">
      <i class="fa-solid fa-user"></i> {{ user.username }}
    </div>
  {% endif %}
</nav>
