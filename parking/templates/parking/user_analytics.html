{% extends "parking/base.html" %}
{% block title %}My Analytics{% endblock %}

{% block content %}
<div class="page-container">
    <h2 class="page-title"><i class="fa-solid fa-chart-pie"></i> My Analytics</h2>
    <p class="page-subtitle">Here is a summary of your personal booking activity.</p>
    
    <div class="stat-cards-grid">
        <div class="stat-card-pro">
            <div class="stat-icon"><i class="fa-solid fa-ticket"></i></div>
            <div class="stat-info">
                <h4>My Total Bookings</h4>
                <p>{{ total_bookings }}</p>
            </div>
        </div>
        <div class="stat-card-pro">
            <div class="stat-icon"><i class="fa-solid fa-indian-rupee-sign"></i></div>
            <div class="stat-info">
                <h4>My Total Spent</h4>
                <p>₹{{ total_spent|floatformat:2 }}</p>
            </div>
        </div>
        <!-- You can add more user-specific stats here in the future -->
    </div>
    
    <a href="{% url 'home' %}" class="btn btn-primary" style="margin-top: 32px;">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
</div>
{% endblock %}
